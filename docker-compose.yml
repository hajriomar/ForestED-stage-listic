services:

  backend:

    build:
      context: ./backend_python

    container_name: forested_backend

    volumes:
      - ./backend_python:/app

    working_dir: /app

    ports:
      - "8000:8000"

    environment:
      - APP_ENV=${APP_ENV:-development}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./forested.db}

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  frontend:

    build:
      context: ./front

    container_name: forested_frontend

    volumes:
      - ./front/app:/app

    ports:
      - "8050:8050"

    working_dir: /app

    environment:
      - API_BASE_URL=${API_BASE_URL:-http://backend:8000}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-flask-secret-change-me}
      # URL publique du dashboard, utilisée pour construire les liens
      # d'accès invité (/access/<clé>) affichés dans la page admin.
      - DASHBOARD_BASE_URL=${DASHBOARD_BASE_URL:-http://127.0.0.1:8050}

    depends_on:
      - backend

    command: python main.py